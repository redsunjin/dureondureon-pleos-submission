<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>차량별 협력 주차 참여</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/admin/style.css"><script src="/admin/participate.js?v=4" defer></script></head><body>
<header class="topbar"><div class="identity"><a class="brand" href="/admin/">SWARM</a><h1>협력 주차 참여</h1></div><a href="/admin/">운영 화면</a></header>
<main class="participation"><p class="guidance">가상 차량 통신 시험 · 실제 차량 이동 없음 · 링크는 해당 차량의 응답 권한을 가지므로 별도로 관리하세요.</p><p id="feedback" role="status">연결 준비 중</p>
<section id="operator"><h2>관제 시험</h2><label>관제 표식 <input id="owner" value="PARTICIPATION-DEMO" maxlength="80"></label><div class="button-row"><button id="create">새 초기 배치 만들기</button><button id="restore">현재 계획 확인</button></div><p>새 초기 배치는 별도 시험입니다. 중단 위치를 유지하려면 현재 배치 재계획을 사용하세요.</p><div id="invitations"></div><div class="button-row"><button id="start" disabled>전원 동의 후 시작</button><button id="stop" disabled>중단</button><button id="replan" disabled>현재 배치에서 재계획</button></div></section>
<section><h2 id="title">참여 요청</h2><p id="summary"></p><p id="plan"></p><div id="steps"></div><p id="decision"></p><div id="responses" hidden class="button-row"><button id="approve">이 이동 계획에 동의</button><button id="reject">거부</button><button id="withdraw">동의 철회·중단</button></div><button id="retry" hidden>같은 요청으로 결과 다시 확인</button><p>다른 차량의 응답이나 재계획 후에는 최신 요청을 확인하고 다시 응답하세요. 전원 동의만으로 시작하지 않으며 관제의 명시적인 시작이 필요합니다.</p></section></main></body></html>
